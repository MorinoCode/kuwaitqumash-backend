# CI: فقط چک و تست روی branch dev و روی PR به main/dev
# Deploy انجام نمی‌شود؛ فقط اطمینان از سالم بودن کد

name: CI (Check & Test)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: "test"
          OPENAI_API_KEY: "sk-dummy-for-ci-no-real-calls"
          REDIS_ENABLED: "false"
