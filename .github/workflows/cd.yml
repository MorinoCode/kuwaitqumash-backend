name: Backend CD (Docker + Oracle Cloud)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Verify Lint & Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret
      DB_NAME: ci_test_db
      DB_USER: postgres
      DB_PASS: ci_test_pass
      REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci

  build-and-push:
    name: Build & Push Docker Image (ARM64 + AMD64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.prep.outputs.image_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        id: prep
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for ARM64 Oracle Cloud)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          tags: |
            ${{ steps.prep.outputs.image_name }}:latest
            ${{ steps.prep.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-oracle:
    name: Deploy to Oracle Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip if Oracle SSH secrets are not configured yet
        id: check
        run: |
          if [ -z "${{ secrets.ORACLE_HOST }}" ] || [ -z "${{ secrets.ORACLE_SSH_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Oracle secrets (ORACLE_HOST / ORACLE_SSH_KEY) not set yet. Skipping auto-deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH to Oracle Cloud VM
        if: steps.check.outputs.ready == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

          SSH_OPTS="-i ~/.ssh/oracle_key -o StrictHostKeyChecking=accept-new"
          APP_DIR="~/kuwaitqumash-backend"

          ssh $SSH_OPTS "$ORACLE_USER@$ORACLE_HOST" "mkdir -p $APP_DIR"
          scp $SSH_OPTS docker-compose.prod.yml "$ORACLE_USER@$ORACLE_HOST:$APP_DIR/docker-compose.prod.yml"

          ssh $SSH_OPTS "$ORACLE_USER@$ORACLE_HOST" bash -s <<EOF
            set -e
            cd $APP_DIR
            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env does not exist on Oracle server yet."
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export BACKEND_IMAGE="$BACKEND_IMAGE"
            docker compose -f docker-compose.prod.yml pull api migrate whatsapp-worker dashboard-worker pg-backup
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          EOF
